global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: aixion-agent-trust-control-plane
    metrics_path: /agent/runs/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/aixion_metrics_token
    static_configs:
      - targets:
          - api:8000
