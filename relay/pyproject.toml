[project]
name = "aixion-agent-relay"
version = "0.1.0"
description = "Outbound-only provider-neutral relay for Aixion Control Tower."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "keyring>=25.2.0",
  "platformdirs>=4.2.0"
]

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.1.0"]
antigravity = ["google-antigravity>=0.1.0"]
openclaw = ["websockets>=13.0"]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff==0.15.13"
]

[project.scripts]
aixion-relay = "aixion_relay.cli:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aixion_relay*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
