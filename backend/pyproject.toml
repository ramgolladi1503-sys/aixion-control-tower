[project]
name = "aixion-control-tower-backend"
version = "0.1.0"
description = "MVP backend for Aixion Control Tower."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "email-validator>=2.2.0",
  "httpx>=0.27.0",
  "google-auth[requests]>=2.35.0",
  "cryptography>=44.0.0",
  "psycopg[binary,pool]>=3.3,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff==0.15.13",
  "PyYAML>=6.0.2"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = ["tests", "tests.*", "runtime", "runtime.*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
