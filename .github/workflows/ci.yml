name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run backend tests
        run: python -m pytest

  android:
    name: Android validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run Android JVM tests
        run: ./gradlew testDebugUnitTest

      - name: Build Android debug APK
        run: ./gradlew assembleDebug

      - name: Build Android release variant
        run: ./gradlew assembleRelease

  mission-control-container:
    name: Mission Control container validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --tag aixion-mission-control-ci ./backend

      - name: Start backend container
        run: |
          docker run --detach --name aixion-mission-control-ci \
            --publish 8000:8000 \
            --env AIXION_PROFILE=demo \
            --env AIXION_AUTH_ENABLED=false \
            --env AIXION_DB_PATH=/app/runtime/ci.sqlite3 \
            aixion-mission-control-ci

      - name: Wait for health and verify Mission Control API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/agent/runs/summary
          curl --fail http://127.0.0.1:8000/agent/runs/metrics

      - name: Show backend logs on failure
        if: failure()
        run: docker logs aixion-mission-control-ci

      - name: Stop backend container
        if: always()
        run: docker rm --force aixion-mission-control-ci || true
